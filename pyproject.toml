[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market_intel"
version = "0.1.0"
description = "NSE/BSE corporate-filings intelligence and event enrichment"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Prashant Sirohi" }]
dependencies = [
    "duckdb>=1.0",
    "requests>=2.31",
    "PyMuPDF>=1.23",
    "pdfplumber>=0.10",
    "pytesseract>=0.3",
    "Pillow>=10",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.30"]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
test = ["pytest>=8.0", "pytest-cov>=4.1"]

[project.scripts]
market-intel = "cli.main:main"
market-intel-llm-enrich = "jobs.run_llm_enrich:main"
market-intel-high-value-v1 = "jobs.run_high_value_v1:main"
market-intel-security-master-v1 = "jobs.run_security_master_v1:main"
market-intel-jcurve-backfill-v1 = "jobs.run_jcurve_backfill_v1:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"*" = ["storage/schema.sql", "storage/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
